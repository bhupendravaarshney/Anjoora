<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f33" />
    <title>ANJOORA — Reconnect</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #f2e8d2;
        color: #20352a;
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 30rem);
        border: 1px solid rgba(107, 75, 46, .28);
        background: #fbf5e7;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 24px 70px rgba(42, 29, 19, .12);
      }
      img { width: 5rem; height: 5rem; }
      p:first-of-type {
        margin: 1.5rem 0 .5rem;
        color: #8b432d;
        font-size: .75rem;
        font-weight: 700;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: Baskerville, "Iowan Old Style", Georgia, serif;
        font-size: clamp(2.25rem, 9vw, 3.5rem);
        font-weight: 400;
        line-height: .98;
      }
      .copy { margin: 1rem auto 0; max-width: 24rem; color: #65655d; line-height: 1.7; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 1.5rem;
        min-height: 3rem;
        border: 0;
        border-radius: .2rem;
        background: #263f32;
        color: #fffaf0;
        padding: .75rem 1.5rem;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/anjoora-logo-mark.svg" alt="" />
      <p>The apothecary is temporarily out of reach</p>
      <h1>Let us reconnect.</h1>
      <p class="copy">Your consultation folio remains saved privately on this device. Reconnect to continue or send it for Vaidya review.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
